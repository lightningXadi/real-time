<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #f0eeff;
      --surface:    #ffffff;
      --surface2:   #e4e0ff;
      --border:     #111111;
      --accent:     #4f35e8;
      --accent2:    #7c5cfc;
      --accent-bg:  #ddd8ff;
      --text:       #111111;
      --text-muted: #666680;
      --bubble-out: #4f35e8;
      --bubble-in:  #ffffff;
      --shadow-hard: 3px 3px 0px #111111;
      --shadow-card: 4px 4px 0px #111111;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cabinet Grotesk', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #header .avatar {
      width: 38px; height: 38px;
      border-radius: 8px;
      background: var(--accent);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-hard);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    #header .info { flex: 1; }
    #header .info h2 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    #header .info span {
      font-size: 0.7rem;
      font-weight: 700;
      color: #22a85a;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22a85a;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* ── Clear button ── */
    #clear-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-hard);
      color: var(--text);
      border-radius: 6px;
      padding: 0.35rem 0.85rem;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: transform 0.1s, box-shadow 0.1s;
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }
    #clear-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--border);
    }
    #clear-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border);
    }
    #clear-btn svg {
      width: 13px; height: 13px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Confirm toast ── */
    #confirm-toast {
      display: none;
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 5px 5px 0px var(--border);
      padding: 1rem 1.4rem;
      z-index: 100;
      text-align: center;
      white-space: nowrap;
    }
    #confirm-toast.show {
      display: block;
      animation: drop-in 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes drop-in {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    #confirm-toast p {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.75rem;
    }
    #confirm-toast .actions { display: flex; gap: 0.5rem; justify-content: center; }
    #confirm-toast .actions button {
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 1rem;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-hard);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #confirm-toast .actions button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--border);
    }
    #confirm-toast .actions button:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border);
    }
    #btn-cancel  { background: var(--surface2); color: var(--text); }
    #btn-confirm { background: var(--accent); color: #fff; }

    /* ── Messages ── */
    #messages {
      list-style: none;
      flex: 1;
      padding: 1.25rem 1rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    #messages li {
      display: flex;
      animation: pop-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    #messages li:nth-child(odd)  { justify-content: flex-start; }
    #messages li:nth-child(even) { justify-content: flex-end; }

    .bubble {
      max-width: 72%;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      border: 2px solid var(--border);
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.5;
      word-break: break-word;
    }

    #messages li:nth-child(odd) .bubble {
      background: var(--bubble-in);
      color: var(--text);
      border-bottom-left-radius: 3px;
      box-shadow: var(--shadow-card);
    }
    #messages li:nth-child(even) .bubble {
      background: var(--bubble-out);
      color: #fff;
      border-bottom-right-radius: 3px;
      box-shadow: 4px 4px 0px #2a19a0;
    }

    /* System message */
    .system-msg { justify-content: center !important; }
    .system-msg span {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 0.2rem 0.85rem;
      letter-spacing: 0.03em;
    }

    /* ── Form ── */
    #form {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border-top: 2px solid var(--border);
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    #input {
      flex: 1;
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow-hard);
      transition: box-shadow 0.1s, transform 0.1s;
    }
    #input::placeholder { color: var(--text-muted); }
    #input:focus {
      box-shadow: 4px 4px 0px var(--accent);
      border-color: var(--accent);
    }

    #form button[type="submit"] {
      width: 44px; height: 44px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-hard);
      transition: transform 0.1s, box-shadow 0.1s;
      flex-shrink: 0;
    }
    #form button[type="submit"]:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--border);
    }
    #form button[type="submit"]:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    #form button[type="submit"] svg {
      width: 18px; height: 18px;
      fill: none;
      stroke: white;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Empty state ── */
    #empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }
    #empty .icon-wrap {
      width: 56px; height: 56px;
      border-radius: 12px;
      background: var(--accent-bg);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-card);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin-bottom: 0.5rem;
    }
    #empty strong {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    #empty p {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div id="header">
    <div class="avatar">💬</div>
    <div class="info">
      <h2>Group Chat</h2>
      <span><span class="dot"></span>Online</span>
    </div>
    <button id="clear-btn">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Clear
    </button>
  </div>

  <div id="confirm-toast">
    <p>Clear all messages for everyone?</p>
    <div class="actions">
      <button id="btn-cancel">Cancel</button>
      <button id="btn-confirm">Yes, clear</button>
    </div>
  </div>

  <ul id="messages">
    <li id="empty-state" style="width:100%">
      <div id="empty">
        <div class="icon-wrap">💬</div>
        <strong>Say something!</strong>
        <p>Messages will appear here</p>
      </div>
    </li>
  </ul>

  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Type a message…" />
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let counter = 0;

    const socket = io({
      auth: { serverOffset: 0 },
      ackTimeout: 10000,
      retries: 3,
    });

    const form       = document.getElementById('form');
    const input      = document.getElementById('input');
    const messages   = document.getElementById('messages');
    const toast      = document.getElementById('confirm-toast');
    const clearBtn   = document.getElementById('clear-btn');
    const btnCancel  = document.getElementById('btn-cancel');
    const btnConfirm = document.getElementById('btn-confirm');

    function removeEmpty() {
      const es = document.getElementById('empty-state');
      if (es) es.remove();
    }

    function showEmptyState() {
      if (!document.getElementById('empty-state')) {
        const li = document.createElement('li');
        li.id = 'empty-state';
        li.style.width = '100%';
        li.innerHTML = `<div id="empty"><div class="icon-wrap">💬</div><strong>Say something!</strong><p>Messages will appear here</p></div>`;
        messages.appendChild(li);
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        const clientOffset = `${socket.id}-${counter++}`;
        socket.emit('chat message', input.value.trim(), clientOffset);
        input.value = '';
      }
    });

    socket.on('chat message', (msg, serverOffset) => {
      removeEmpty();
      const item   = document.createElement('li');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg;
      item.appendChild(bubble);
      messages.appendChild(item);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      socket.auth.serverOffset = serverOffset;
    });

    clearBtn.addEventListener('click', () => toast.classList.add('show'));
    btnCancel.addEventListener('click', () => toast.classList.remove('show'));

    btnConfirm.addEventListener('click', () => {
      socket.emit('clear chat');
      toast.classList.remove('show');
    });

    socket.on('chat cleared', () => {
      messages.innerHTML = '';
      const note = document.createElement('li');
      note.className = 'system-msg';
      note.innerHTML = '<span>Chat was cleared</span>';
      messages.appendChild(note);
      setTimeout(() => { note.remove(); showEmptyState(); }, 2500);
      socket.auth.serverOffset = 0;
    });
  </script>
</body>
</html>
