<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0eb;
      --surface: #ffffff;
      --surface2: #ede8e2;
      --accent: #c0622f;
      --accent-soft: #f0ddd3;
      --text: #1e1a17;
      --text-muted: #8a7f77;
      --bubble-out: #c0622f;
      --bubble-in: #ffffff;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --radius: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c0622f' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ── Header ── */
    #header {
      background: var(--surface);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 1px 0 rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #header .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px;
      flex-shrink: 0;
    }

    #header .info { flex: 1; }
    #header .info h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--text);
      line-height: 1.2;
    }
    #header .info span {
      font-size: 0.7rem;
      color: #6cbf6c;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6cbf6c;
      margin-right: 4px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Clear button ── */
    #clear-btn {
      background: none;
      border: 1.5px solid rgba(192, 98, 47, 0.25);
      color: var(--accent);
      border-radius: 2rem;
      padding: 0.35rem 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    #clear-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    #clear-btn svg {
      width: 13px; height: 13px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Confirm toast ── */
    #confirm-toast {
      display: none;
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 1rem;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      z-index: 100;
      text-align: center;
      white-space: nowrap;
    }
    #confirm-toast.show {
      display: block;
      animation: drop-in 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes drop-in {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    #confirm-toast p {
      font-size: 0.88rem;
      color: var(--text);
      margin-bottom: 0.65rem;
    }
    #confirm-toast .actions { display: flex; gap: 0.5rem; justify-content: center; }
    #confirm-toast .actions button {
      border: none;
      border-radius: 2rem;
      padding: 0.4rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #confirm-toast .actions button:hover { opacity: 0.8; }
    #btn-cancel  { background: var(--surface2); color: var(--text); }
    #btn-confirm { background: var(--accent); color: #fff; }

    /* ── Messages ── */
    #messages {
      list-style: none;
      flex: 1;
      padding: 1.5rem 1rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #messages li {
      display: flex;
      animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    #messages li.own   { justify-content: flex-end; }
    #messages li.other { justify-content: flex-start; }

    .bubble {
      max-width: 72%;
      padding: 0.65rem 1rem;
      border-radius: var(--radius);
      font-size: 0.93rem;
      line-height: 1.5;
      word-break: break-word;
    }

    /* Own messages: always accent */
    li.own .bubble {
      background: var(--bubble-out);
      color: #fff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 4px 16px rgba(192, 98, 47, 0.35);
    }

    /* Other users: unique colours drawn from the warm theme palette */
    li.other .bubble {
      color: #fff;
      border-bottom-left-radius: 5px;
      box-shadow: var(--shadow);
    }

    /* Sender name label */
    .sender-label {
      font-size: 0.68rem;
      font-weight: 600;
      margin-bottom: 2px;
      padding: 0 0.4rem;
      opacity: 0.8;
    }

    /* 8 warm palette colours matching the terracotta/warm theme */
    .uc-0 { background: #6b7f3a; } .lc-0 { color: #6b7f3a; } /* olive        */
    .uc-1 { background: #4a7fa5; } .lc-1 { color: #4a7fa5; } /* slate blue   */
    .uc-2 { background: #9b4f96; } .lc-2 { color: #9b4f96; } /* dusty purple */
    .uc-3 { background: #2e8b6e; } .lc-3 { color: #2e8b6e; } /* teal         */
    .uc-4 { background: #b5782a; } .lc-4 { color: #b5782a; } /* amber        */
    .uc-5 { background: #c14d6a; } .lc-5 { color: #c14d6a; } /* rose         */
    .uc-6 { background: #3d6fa8; } .lc-6 { color: #3d6fa8; } /* cornflower   */
    .uc-7 { background: #7a6e3a; } .lc-7 { color: #7a6e3a; } /* dark gold    */

    /* System message */
    .system-msg { justify-content: center !important; }
    .system-msg span {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--surface2);
      border-radius: 2rem;
      padding: 0.25rem 0.9rem;
    }

    /* ── Form ── */
    #form {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 0.75rem 1rem;
      background: rgba(245, 240, 235, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    #input {
      flex: 1;
      border: 1.5px solid transparent;
      background: var(--surface);
      border-radius: 2rem;
      padding: 0.7rem 1.2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.93rem;
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input::placeholder { color: var(--text-muted); }
    #input:focus {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(192, 98, 47, 0.18);
    }

    #form button[type="submit"] {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(192, 98, 47, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    #form button[type="submit"]:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(192, 98, 47, 0.5);
    }
    #form button[type="submit"]:active { transform: scale(0.95); }
    #form button[type="submit"] svg {
      width: 20px; height: 20px;
      fill: none;
      stroke: white;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Empty state */
    #empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    #empty .icon { font-size: 2.5rem; margin-bottom: 0.25rem; }
    #empty strong { font-family: 'Playfair Display', serif; color: var(--text); font-size: 1.1rem; }
  </style>
</head>
<body>

  <div id="header">
    <div class="avatar">💬</div>
    <div class="info">
      <h2>Group Chat</h2>
      <span><span class="dot"></span>Online</span>
    </div>
    <button id="clear-btn">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Clear
    </button>
  </div>

  <div id="confirm-toast">
    <p>Clear all messages for everyone?</p>
    <div class="actions">
      <button id="btn-cancel">Cancel</button>
      <button id="btn-confirm">Yes, clear</button>
    </div>
  </div>

  <ul id="messages">
    <li id="empty-state">
      <div id="empty">
        <div class="icon">✦</div>
        <strong>Say something!</strong>
        <span>Messages will appear here</span>
      </div>
    </li>
  </ul>

  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Type a message…" />
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let counter = 0;

    const socket = io({
      auth: { serverOffset: 0 },
      ackTimeout: 10000,
      retries: 3,
    });

    const form       = document.getElementById('form');
    const input      = document.getElementById('input');
    const messages   = document.getElementById('messages');
    const toast      = document.getElementById('confirm-toast');
    const clearBtn   = document.getElementById('clear-btn');
    const btnCancel  = document.getElementById('btn-cancel');
    const btnConfirm = document.getElementById('btn-confirm');

    function removeEmpty() {
      const es = document.getElementById('empty-state');
      if (es) es.remove();
    }

    function showEmptyState() {
      if (!document.getElementById('empty-state')) {
        const li = document.createElement('li');
        li.id = 'empty-state';
        li.innerHTML = `<div id="empty"><div class="icon">✦</div><strong>Say something!</strong><span>Messages will appear here</span></div>`;
        messages.appendChild(li);
      }
    }

    // Send
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        const clientOffset = `${socket.id}-${counter++}`;
        socket.emit('chat message', input.value.trim(), clientOffset);
        input.value = '';
      }
    });

    // Per-user colour assignment
    const userColours = {};
    const userNames   = {};
    let nextColour = 0, nextUser = 1;

    function getColour(uid) {
      if (!(uid in userColours)) { userColours[uid] = nextColour++ % 8; }
      return userColours[uid];
    }
    function getName(uid) {
      if (!(uid in userNames)) { userNames[uid] = 'Guest ' + nextUser++; }
      return userNames[uid];
    }

    socket.on('chat message', (msg, serverOffset, senderId) => {
      removeEmpty();
      const isOwn = senderId === socket.id;
      const ci    = getColour(senderId);

      const item = document.createElement('li');
      item.className = isOwn ? 'own' : 'other';

      if (!isOwn) {
        const label = document.createElement('div');
        label.className = `sender-label lc-${ci}`;
        label.textContent = getName(senderId);
        item.appendChild(label);
      }

      const bubble = document.createElement('div');
      bubble.className = isOwn ? 'bubble' : `bubble uc-${ci}`;
      bubble.textContent = msg;
      item.appendChild(bubble);
      messages.appendChild(item);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      socket.auth.serverOffset = serverOffset;
    });

    // Clear — show confirm
    clearBtn.addEventListener('click', () => toast.classList.add('show'));
    btnCancel.addEventListener('click', () => toast.classList.remove('show'));

    btnConfirm.addEventListener('click', () => {
      socket.emit('clear chat');
      toast.classList.remove('show');
    });

    // Server confirmed clear — wipe UI for all clients
    socket.on('chat cleared', () => {
      messages.innerHTML = '';
      Object.keys(userColours).forEach(k => delete userColours[k]);
      Object.keys(userNames).forEach(k => delete userNames[k]);
      nextColour = 0; nextUser = 1;
      const note = document.createElement('li');
      note.className = 'system-msg';
      note.innerHTML = '<span>✦ Chat was cleared</span>';
      messages.appendChild(note);
      setTimeout(() => { note.remove(); showEmptyState(); }, 2500);
      socket.auth.serverOffset = 0;
    });
  </script>
</body>
</html>
