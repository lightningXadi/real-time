<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0eb;
      --surface: #ffffff;
      --surface2: #ede8e2;
      --accent: #c0622f;
      --accent-soft: #f0ddd3;
      --text: #1e1a17;
      --text-muted: #8a7f77;
      --radius: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Archivo', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }

    /* ── Header ── */
    #header {
      background: var(--surface);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      box-shadow: 0 1px 0 rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* Hand-pressed seal mark, replaces a literal emoji avatar */
    #header .seal {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--accent);
      position: relative;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 3px 8px rgba(192,98,47,0.35);
    }
    #header .seal::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.45);
    }
    #header .seal span {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: #fff;
      transform: translateY(-1px);
    }

    #header .info { flex: 1; min-width: 0; }
    #header .info h2 {
      font-family: 'Fraunces', serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    #header .info .status {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 1.1em;
    }
    #header .info .status .live { color: #5fa872; }

    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #5fa872;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Clear button ── */
    #clear-btn {
      background: none;
      border: 1.5px solid rgba(192, 98, 47, 0.22);
      color: var(--accent);
      border-radius: 2rem;
      padding: 0.35rem 0.9rem;
      font-family: 'Archivo', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    #clear-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    #clear-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #clear-btn svg {
      width: 13px; height: 13px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Confirm toast ── */
    #confirm-toast {
      display: none;
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 1rem;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      z-index: 100;
      text-align: center;
      white-space: nowrap;
    }
    #confirm-toast.show {
      display: block;
      animation: drop-in 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes drop-in {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    #confirm-toast p {
      font-size: 0.88rem;
      color: var(--text);
      margin-bottom: 0.65rem;
    }
    #confirm-toast .actions { display: flex; gap: 0.5rem; justify-content: center; }
    #confirm-toast .actions button {
      border: none;
      border-radius: 2rem;
      padding: 0.4rem 1rem;
      font-family: 'Archivo', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #confirm-toast .actions button:hover { opacity: 0.8; }
    #confirm-toast .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #btn-cancel  { background: var(--surface2); color: var(--text); }
    #btn-confirm { background: var(--accent); color: #fff; }

    /* ── Messages ── */
    #messages {
      list-style: none;
      flex: 1;
      padding: 1.5rem 1rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #messages li {
      display: flex;
      animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    #messages li.own   { justify-content: flex-end; }
    #messages li.other { justify-content: flex-start; }

    .msg-stack {
      max-width: 72%;
      display: flex;
      flex-direction: column;
    }
    li.own .msg-stack   { align-items: flex-end; }
    li.other .msg-stack { align-items: flex-start; }

    .bubble {
      padding: 0.65rem 1rem;
      border-radius: var(--radius);
      font-size: 0.93rem;
      line-height: 1.5;
      word-break: break-word;
      color: #fff;
      position: relative;
      cursor: default;
    }

    li.own .bubble   { border-bottom-right-radius: 5px; }
    li.other .bubble { border-bottom-left-radius: 5px; }

    /* Timestamp — revealed on tap/hover rather than always-on clutter */
    .timestamp {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      padding: 0 0.3rem;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.18s ease, opacity 0.18s ease;
    }
    .msg-stack.revealed .timestamp { max-height: 1.2em; opacity: 1; }

    /* 10 warm glaze colours */
    .uc-0 { background: #c0622f; box-shadow: 0 4px 14px rgba(192,98,47,0.35);  }
    .uc-1 { background: #6b7f3a; box-shadow: 0 4px 14px rgba(107,127,58,0.35); }
    .uc-2 { background: #4a7fa5; box-shadow: 0 4px 14px rgba(74,127,165,0.35); }
    .uc-3 { background: #9b4f96; box-shadow: 0 4px 14px rgba(155,79,150,0.35); }
    .uc-4 { background: #2e8b6e; box-shadow: 0 4px 14px rgba(46,139,110,0.35); }
    .uc-5 { background: #b5782a; box-shadow: 0 4px 14px rgba(181,120,42,0.35); }
    .uc-6 { background: #c14d6a; box-shadow: 0 4px 14px rgba(193,77,106,0.35); }
    .uc-7 { background: #5a6fa8; box-shadow: 0 4px 14px rgba(90,111,168,0.35); }
    .uc-8 { background: #7a6e3a; box-shadow: 0 4px 14px rgba(122,110,58,0.35); }
    .uc-9 { background: #3d7a5a; box-shadow: 0 4px 14px rgba(61,122,90,0.35);  }

    /* System message */
    .system-msg { justify-content: center !important; }
    .system-msg span {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--surface2);
      border-radius: 2rem;
      padding: 0.25rem 0.9rem;
    }

    /* ── Typing indicator — an unfinished bubble, lives in the message flow ── */
    #typing-row { display: none; justify-content: flex-start; }
    #typing-row.show { display: flex; }
    .typing-bubble {
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
      padding: 0.6rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .typing-bubble i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      animation: typing-bounce 1.1s infinite ease-in-out;
    }
    .typing-bubble i:nth-child(2) { animation-delay: 0.15s; }
    .typing-bubble i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30% { transform: translateY(-3px); opacity: 1; }
    }

    /* ── Form ── */
    #form {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 0.75rem 1rem;
      background: rgba(245, 240, 235, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    #input {
      flex: 1;
      border: 1.5px solid transparent;
      background: var(--surface);
      border-radius: 2rem;
      padding: 0.7rem 1.2rem;
      font-family: 'Archivo', sans-serif;
      font-size: 0.93rem;
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input::placeholder { color: var(--text-muted); }
    #input:focus {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(192, 98, 47, 0.18);
    }

    #form button[type="submit"] {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(192, 98, 47, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    #form button[type="submit"]:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(192, 98, 47, 0.5);
    }
    #form button[type="submit"]:active { transform: scale(0.95); }
    #form button[type="submit"]:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    #form button[type="submit"] svg {
      width: 20px; height: 20px;
      fill: none;
      stroke: white;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Empty state */
    #empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    #empty .icon {
      font-family: 'Fraunces', serif;
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }
    #empty strong { font-family: 'Fraunces', serif; font-weight: 600; color: var(--text); font-size: 1.1rem; }
  </style>
</head>
<body>

  <div id="header">
    <div class="seal"><span>G</span></div>
    <div class="info">
      <h2>Group Chat</h2>
      <span class="status" id="status-line"><span class="dot"></span><span class="live">Online</span></span>
    </div>
    <button id="clear-btn">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Clear
    </button>
  </div>

  <div id="confirm-toast">
    <p>Clear all messages for everyone?</p>
    <div class="actions">
      <button id="btn-cancel">Cancel</button>
      <button id="btn-confirm">Yes, clear</button>
    </div>
  </div>

  <ul id="messages">
    <li id="empty-state">
      <div id="empty">
        <div class="icon">&ldquo;</div>
        <strong>Say something!</strong>
        <span>Messages will appear here</span>
      </div>
    </li>
    <li id="typing-row">
      <div class="typing-bubble uc-0" id="typing-bubble">
        <i></i><i></i><i></i>
      </div>
    </li>
  </ul>

  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Type a message…" maxlength="1000" />
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let counter = 0;

    const socket = io({
      auth: { serverOffset: 0 },
      ackTimeout: 10000,
      retries: 3,
    });

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const toast = document.getElementById('confirm-toast');
    const clearBtn = document.getElementById('clear-btn');
    const btnCancel = document.getElementById('btn-cancel');
    const btnConfirm = document.getElementById('btn-confirm');
    const typingRow = document.getElementById('typing-row');
    const typingBubble = document.getElementById('typing-bubble');
    const statusLine = document.getElementById('status-line');

    function removeEmpty() {
      const es = document.getElementById('empty-state');
      if (es) es.remove();
    }

    function showEmptyState() {
      if (!document.getElementById('empty-state')) {
        const li = document.createElement('li');
        li.id = 'empty-state';
        li.innerHTML = `<div id="empty"><div class="icon">&ldquo;</div><strong>Say something!</strong><span>Messages will appear here</span></div>`;
        messages.insertBefore(li, typingRow);
      }
    }

    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function isNearBottom() {
      return window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
    }

    // ── Send ──
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (value) {
        const clientOffset = `${socket.id}-${counter++}`;
        socket.emit('chat message', value, clientOffset, () => {});
        input.value = '';
        stopTyping();
      }
    });

    // ── Typing indicator (outgoing) ──
    let typingTimeout = null;
    let isTypingNow = false;

    function startTyping() {
      if (!isTypingNow) {
        isTypingNow = true;
        socket.volatile.emit('typing');
      }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(stopTyping, 1800);
    }

    function stopTyping() {
      if (isTypingNow) {
        isTypingNow = false;
        socket.volatile.emit('stop typing');
      }
      clearTimeout(typingTimeout);
    }

    input.addEventListener('input', () => {
      if (input.value.length > 0) startTyping();
      else stopTyping();
    });
    input.addEventListener('blur', stopTyping);

    // ── Typing indicator (incoming) ──
    const typingUsers = new Map(); // userId -> colorIndex

    function renderTypingRow() {
      if (typingUsers.size === 0) {
        typingRow.classList.remove('show');
        return;
      }
      const [, colorIndex] = [...typingUsers][0];
      typingBubble.className = `typing-bubble uc-${colorIndex}`;
      typingRow.classList.add('show');
      if (isNearBottom()) {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }

    socket.on('typing', (userId, colorIndex) => {
      typingUsers.set(userId, colorIndex);
      renderTypingRow();
    });

    socket.on('stop typing', (userId) => {
      typingUsers.delete(userId);
      renderTypingRow();
    });

    // Server tells us our own socket id so we know which side to put our bubbles
    let myId = null;
    socket.on('your id', (id) => { myId = id; });

    socket.on('chat message', (msg, serverOffset, senderId, colorIndex) => {
      removeEmpty();
      const isOwn = senderId === myId;
      const wasNearBottom = isNearBottom();

      // A real message from this sender means their typing state is over
      typingUsers.delete(senderId);
      renderTypingRow();

      const item = document.createElement('li');
      item.className = isOwn ? 'own' : 'other';

      const stack = document.createElement('div');
      stack.className = 'msg-stack';

      const bubble = document.createElement('div');
      bubble.className = `bubble uc-${colorIndex}`;
      bubble.textContent = msg;
      bubble.tabIndex = 0;
      bubble.setAttribute('role', 'button');
      bubble.setAttribute('aria-label', 'Message, tap to show time sent');

      const time = document.createElement('span');
      time.className = 'timestamp';
      time.textContent = formatTime(new Date());

      function toggleTime() { stack.classList.toggle('revealed'); }
      bubble.addEventListener('click', toggleTime);
      bubble.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTime(); }
      });

      stack.appendChild(bubble);
      stack.appendChild(time);
      item.appendChild(stack);
      messages.insertBefore(item, typingRow);

      if (wasNearBottom || isOwn) {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
      socket.auth.serverOffset = serverOffset;
    });

    // ── Clear — show confirm ──
    clearBtn.addEventListener('click', () => toast.classList.add('show'));
    btnCancel.addEventListener('click', () => toast.classList.remove('show'));

    btnConfirm.addEventListener('click', () => {
      socket.emit('clear chat');
      toast.classList.remove('show');
    });

    // Server confirmed clear — wipe UI for all clients
    socket.on('chat cleared', () => {
      [...messages.querySelectorAll('li')].forEach(li => {
        if (li.id !== 'typing-row') li.remove();
      });
      typingUsers.clear();
      renderTypingRow();
      const note = document.createElement('li');
      note.className = 'system-msg';
      note.innerHTML = '<span>&ldquo; Chat was cleared</span>';
      messages.insertBefore(note, typingRow);
      setTimeout(() => { note.remove(); showEmptyState(); }, 2500);
      socket.auth.serverOffset = 0;
    });

    // ── Connection status in the header ──
    socket.on('disconnect', () => {
      statusLine.innerHTML = '<span class="dot" style="background:#b5782a;animation:none"></span><span style="color:var(--text-muted)">Reconnecting…</span>';
    });
    socket.on('connect', () => {
      statusLine.innerHTML = '<span class="dot"></span><span class="live">Online</span>';
    });
  </script>
</body>
</html>
